# Bacon — chequeo continuo en fondo.
# `bacon` (job check) | `bacon clippy` | `bacon test`
# Para el ciclo de edición usa `bacon clippy`; `just verify` es la puerta completa.

default_job = "check"

[jobs.check]
command = ["cargo", "check", "--workspace"]
need_stdout = false

[jobs.clippy]
command = ["cargo", "clippy", "--workspace", "--all-targets", "--", "-D", "warnings"]
need_stdout = false

[jobs.audit]
command = ["just", "audit"]
need_stdout = true
default_watch = false
watch = ["Cargo.lock", ".cargo/audit.toml"]

[jobs.test]
command = ["cargo", "test", "--workspace"]
need_stdout = true

[jobs.fmt]
command = ["just", "fmt"]
need_stdout = true

[jobs.test-dev-reset]
command = ["just", "test-dev-reset"]
need_stdout = true
default_watch = false
watch = ["crates/kp-peers", "justfile", "Cargo.toml", "Cargo.lock"]

[jobs.p2p-demo]
command = ["just", "p2p-demo"]
need_stdout = true
default_watch = false
watch = ["crates/kp-protocol", "crates/kp-transport", "crates/kp-identity", "crates/kp-pairing", "Cargo.toml", "Cargo.lock"]

[jobs.verify-sync-session]
command = ["just", "verify-sync-session"]
need_stdout = true
allow_warnings = false
watch = ["crates/kp-sync", "crates/kp-devices", "crates/kp-protocol", "crates/kp-pairing", "crates/kp-transport", "Cargo.toml", "Cargo.lock"]

[jobs.turn-smoke]
command = ["just", "turn-smoke"]
need_stdout = true
default_watch = false
watch = ["crates/kp-lan", "justfile", "bacon.toml"]

[jobs.browser]
command = ["just", "browser-build"]
need_stdout = true
default_watch = false
watch = ["crates/kp-browser", "Cargo.toml"]

[jobs.pinentry]
command = ["just", "pinentry-build"]
need_stdout = true
default_watch = false
watch = ["crates/kp-pinentry", "crates/kp-approval", "Cargo.toml"]
